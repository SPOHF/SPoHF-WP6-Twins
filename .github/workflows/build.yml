name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!*/**.md"
  pull_request:
    branches: [main]

env:
  # Single registry: the v2 cluster's Harbor. Production moved to v2 on 2026-07-15,
  # so the legacy harbor.prod push has been dropped — old is now a FROZEN fallback
  # and must not pick up new images (its ImageUpdater watches harbor.prod). The
  # dual-push to harbor.prod during the parallel run is in git history if a rollback
  # ever needs to feed old again. harbor.prod itself dies with old (issue 043).
  REGISTRY: harbor.inf.fontysvenlo.dev
  IMAGE_NAME: spohf/wp6-data

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Start TimescaleDB
        run: docker compose -f docker-compose.tsdb.yml up -d

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Run unit tests
        run: uv run pytest tests/

      - name: Wait for TimescaleDB ready
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.tsdb.yml exec -T timescaledb \
                 psql -U wp6_red -d wp6_red -c 'SELECT 1' >/dev/null 2>&1; then
              echo "TimescaleDB ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "TimescaleDB did not become ready in time"
          docker compose -f docker-compose.tsdb.yml logs
          exit 1

      - name: Run e2e tests
        run: uv run pytest tests/e2e/ -v --tb=short

      - name: Dump TimescaleDB logs on failure
        if: failure()
        run: docker compose -f docker-compose.tsdb.yml logs

      - name: Stop TimescaleDB
        if: always()
        run: docker compose -f docker-compose.tsdb.yml down -v

  build:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: blue
            image_suffix: "-blue"
          - target: red
            image_suffix: "-red"
          - target: grey
            image_suffix: "-grey"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for commit count

      - name: Generate version
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v1.0.${COMMIT_COUNT}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        # HARBOR_SPOHF_* are scoped to the spohf project on the v2 Harbor.
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_SPOHF_USERNAME }}
          password: ${{ secrets.HARBOR_SPOHF_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push (${{ matrix.target }})
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        if: matrix.target == 'blue'  # Only tag once, not for each matrix job
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
