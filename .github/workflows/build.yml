name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!*/**.md"
  pull_request:
    branches: [main]

env:
  # Two registries for the duration of the cluster migration (issue 034).
  #
  # V1 lives *on* the old cluster and dies with it. Keeping it fed means old stays
  # a patchable fallback rather than a frozen one — red/blue feature work continues
  # while the migration runs, and a fallback you cannot ship a hotfix to is a weak
  # fallback. Drop V1 when the old cluster is destroyed (issue 043).
  #
  # Image tags are v1.0.<n>-<sha> — registry-agnostic and content-addressed by
  # commit — so the same tag in both registries lets two clusters watching two
  # different Harbors independently converge on the same build.
  REGISTRY_V1: harbor.prod.fontysvenlo.dev
  REGISTRY_V2: harbor.inf.fontysvenlo.dev
  IMAGE_NAME: spohf/wp6-data

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Start TimescaleDB
        run: docker compose -f docker-compose.tsdb.yml up -d

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Run unit tests
        run: uv run pytest tests/

      - name: Wait for TimescaleDB ready
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.tsdb.yml exec -T timescaledb \
                 psql -U wp6_red -d wp6_red -c 'SELECT 1' >/dev/null 2>&1; then
              echo "TimescaleDB ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "TimescaleDB did not become ready in time"
          docker compose -f docker-compose.tsdb.yml logs
          exit 1

      - name: Run e2e tests
        run: uv run pytest tests/e2e/ -v --tb=short

      - name: Dump TimescaleDB logs on failure
        if: failure()
        run: docker compose -f docker-compose.tsdb.yml logs

      - name: Stop TimescaleDB
        if: always()
        run: docker compose -f docker-compose.tsdb.yml down -v

  build:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: blue
            image_suffix: "-blue"
          - target: red
            image_suffix: "-red"
          - target: grey
            image_suffix: "-grey"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for commit count

      - name: Generate version
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v1.0.${COMMIT_COUNT}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The v2 credentials are created as part of the migration and may not exist
      # yet. Rather than hard-wire a second login and break every build on main
      # until someone remembers to add the secrets, resolve the target registries
      # from what is actually configured — and say loudly when v2 is being skipped.
      # (`secrets` is not available in a step `if:`, hence the env indirection.)
      - name: Resolve target registries
        id: registries
        env:
          V2_PASSWORD: ${{ secrets.HARBOR_SPOHF_PASSWORD }}
        run: |
          IMAGES="${REGISTRY_V1}/${IMAGE_NAME}${{ matrix.image_suffix }}"
          if [ -n "$V2_PASSWORD" ]; then
            IMAGES="${IMAGES}"$'\n'"${REGISTRY_V2}/${IMAGE_NAME}${{ matrix.image_suffix }}"
            echo "push_v2=true" >> "$GITHUB_OUTPUT"
            echo "Pushing to both registries: ${REGISTRY_V1}, ${REGISTRY_V2}"
          else
            echo "push_v2=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HARBOR_SPOHF_PASSWORD is not set — skipping ${REGISTRY_V2}. The v2 cluster will NOT receive this build. See issues/034-dual-push-images-to-both-harbors.md"
          fi
          {
            echo "images<<GHA_EOF"
            echo "$IMAGES"
            echo "GHA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor (v1, legacy — dies with the old cluster)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_V1 }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to Harbor (v2)
        # HARBOR_SPOHF_* are scoped to the spohf project on the v2 Harbor — not the
        # HARBOR_USERNAME/PASSWORD pair above, which targets the legacy harbor.prod.
        # Mirrors the HARBOR_<TENANT>_* convention used by the platform repo.
        if: steps.registries.outputs.push_v2 == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_V2 }}
          username: ${{ secrets.HARBOR_SPOHF_USERNAME }}
          password: ${{ secrets.HARBOR_SPOHF_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push (${{ matrix.target }})
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        if: matrix.target == 'blue'  # Only tag once, not for each matrix job
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
