# Local backing services for development and e2e tests.
#
# Named `.tsdb.yml` for historical reasons -- it now also runs an S3-compatible
# object store, so that the S3 code path is exercised locally and in CI rather
# than only against the real bucket. Kept as one file on purpose: the README, the
# e2e conftest hint and .github/workflows/build.yml all reference this filename,
# and CI therefore picks up new services with no workflow change.
services:
  timescaledb:
    image: timescale/timescaledb:2.26.4-pg17
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: wp6
      POSTGRES_PASSWORD: wp6dev
      POSTGRES_DB: wp6_blue
    shm_size: 1gb
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./scripts/init-tsdb.sh:/docker-entrypoint-initdb.d/01-init-tsdb.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wp6 -d wp6_blue"]
      interval: 2s
      timeout: 3s
      retries: 30
  # An S3-compatible store for the object-storage code path, so it is exercised
  # locally and in CI rather than only against the real bucket.
  #
  # This is `adobe/s3mock` — a MOCK, not a real store. It was MinIO, which would
  # have been the same implementation as production (CloudStack's
  # EHV-Object-Storage is MinIO), but MinIO's images are no longer anonymously
  # pullable: both docker.io/minio/minio and quay.io/minio/minio now answer
  # `unauthorized` (CI failure, run 36549563488). Of the freely pullable
  # alternatives this is the smallest and starts in ~1.5s.
  #
  # What that costs: this validates OUR CLIENT — path-style addressing,
  # botocore's error shapes, pagination past the 1000-key page, byte fidelity —
  # but not MinIO's own behaviour. The prod-specific risks (the HARICA TLS chain,
  # CloudStack's per-account credentials) were never covered by a local container
  # anyway; those belong to the probe harness in
  # issues/061-object-storage-to-end-deploy-downtime.md, run against the real
  # bucket. Do not "restore" MinIO here without checking the pull works from CI.
  #
  # Host port 9100, not 9090: keeps the port stable across this swap, and 9000
  # (MinIO's default) is commonly taken by other local tooling.
  s3mock:
    image: adobe/s3mock:3.12.0
    ports:
      - "9100:9090"
    environment:
      # Created on boot: wp6-e2e for the e2e suite, wp6-dev for scripts/dev.sh.
      # Separate on purpose — the e2e fixtures empty their bucket before and
      # after every test, so a shared one would delete what you were looking at.
      initialBuckets: wp6-e2e,wp6-dev
      retainFilesOnExit: "false"
    healthcheck:
      # wget, not curl: this image has no curl.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  tsdb_data:
