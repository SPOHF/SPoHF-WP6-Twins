services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: wp6
      POSTGRES_PASSWORD: wp6dev
      POSTGRES_DB: wp6_blue
    shm_size: 1gb
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./scripts/init-tsdb.sh:/docker-entrypoint-initdb.d/01-init-tsdb.sh:ro
volumes:
  tsdb_data:
