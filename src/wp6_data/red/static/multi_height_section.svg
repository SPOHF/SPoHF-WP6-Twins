<svg width="670" height="330" viewBox="0 0 670 330" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Geometry of the side section of the multi-height wires.
     plan   = the area the interpolated field fills (wires are spread evenly
              across its width; heights H1..H5 run top to bottom)
     legend = where the colour bar is drawn
     node   = size of the box that holds one wire's values (only its width is read) -->
<g id="Frame 1">
<rect id="plan" x="20" y="20" width="630" height="240" rx="3" stroke="black"/>
<rect id="legend" x="20" y="282" width="300" height="12"/>
<rect id="node" x="0" y="0" width="76" height="18" rx="4" stroke="black"/>
</g>
</svg>
