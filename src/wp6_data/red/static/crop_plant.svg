<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 360" width="80" height="360">
  <!-- Placeholder tomato plant, five growth zones (72px each), top=canopy head,
       bottom=root zone. Replace with nicer art later — keep the 80x360 viewBox
       and five-zone layout so it stays aligned to the table rows. -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="0" y1="72" x2="80" y2="72"/>
    <line x1="0" y1="144" x2="80" y2="144"/>
    <line x1="0" y1="216" x2="80" y2="216"/>
    <line x1="0" y1="288" x2="80" y2="288"/>
  </g>
  <!-- stem -->
  <path d="M40 300 C 40 240 40 120 40 14" fill="none" stroke="#3f7d3f"
        stroke-width="4" stroke-linecap="round"/>
  <!-- zone 1: Kop (head leaves) -->
  <g fill="#4ca64c">
    <ellipse cx="26" cy="30" rx="14" ry="7" transform="rotate(-25 26 30)"/>
    <ellipse cx="54" cy="30" rx="14" ry="7" transform="rotate(25 54 30)"/>
    <ellipse cx="40" cy="16" rx="9" ry="6"/>
  </g>
  <!-- zone 2: Bloeiende tros (leaves + flowers) -->
  <g fill="#4ca64c">
    <ellipse cx="24" cy="104" rx="15" ry="7" transform="rotate(-20 24 104)"/>
    <ellipse cx="56" cy="104" rx="15" ry="7" transform="rotate(20 56 104)"/>
  </g>
  <g fill="#f5d020">
    <circle cx="30" cy="120" r="3"/><circle cx="40" cy="124" r="3"/><circle cx="50" cy="120" r="3"/>
  </g>
  <!-- zone 3: Vruchtzetting (green fruit) -->
  <g fill="#6fae4f"><circle cx="30" cy="184" r="7"/><circle cx="46" cy="190" r="6"/></g>
  <g fill="#4ca64c"><ellipse cx="58" cy="172" rx="13" ry="6" transform="rotate(20 58 172)"/></g>
  <!-- zone 4: Afrijping (ripening fruit) -->
  <g fill="#e23b2e"><circle cx="30" cy="252" r="8"/><circle cx="48" cy="258" r="7"/></g>
  <g fill="#f0892f"><circle cx="40" cy="240" r="6"/></g>
  <!-- zone 5: Substraat/wortelzone (soil + roots) -->
  <rect x="0" y="300" width="80" height="60" fill="#c9a66b" opacity="0.5"/>
  <g fill="none" stroke="#8a6a3f" stroke-width="2" stroke-linecap="round">
    <path d="M40 300 C 34 320 28 332 22 348"/>
    <path d="M40 300 C 46 320 52 332 58 348"/>
    <path d="M40 300 C 40 322 40 336 40 350"/>
  </g>
</svg>
