<svg width="670" height="450" viewBox="0 0 670 450" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Schematic plan of the greenhouse for the multi-height plan view.
     Real wire positions are unknown (only "a few metres apart"), so the node
     slots below are illustrative: wires are assigned to them in sorted id order.
     Edit a slot's x/y to move a node; add node_N rects for more wires.
     plan   = the area the interpolated field fills
     legend = where the colour bar is drawn
     node_N = top-left and size of one sensor node (a wire's five heights) -->
<g id="Frame 1">
<rect id="plan" x="20" y="20" width="630" height="380" rx="3" stroke="black"/>
<rect id="legend" x="20" y="418" width="300" height="12"/>
<g id="nodes">
<rect id="node_1" x="75" y="55" width="76" height="124" rx="6" stroke="black"/>
<rect id="node_2" x="225" y="225" width="76" height="124" rx="6" stroke="black"/>
<rect id="node_3" x="375" y="55" width="76" height="124" rx="6" stroke="black"/>
<rect id="node_4" x="525" y="225" width="76" height="124" rx="6" stroke="black"/>
<rect id="node_5" x="75" y="225" width="76" height="124" rx="6" stroke="black"/>
<rect id="node_6" x="525" y="55" width="76" height="124" rx="6" stroke="black"/>
</g>
</g>
</svg>
