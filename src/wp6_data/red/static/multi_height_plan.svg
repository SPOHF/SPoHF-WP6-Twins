<svg width="670" height="330" viewBox="0 0 670 330" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Schematic plan of the greenhouse for the multi-height plan and side views.
     Real wire positions are unknown (only "a few metres apart"), so the nodes
     sit in one line; wires are assigned to the slots in sorted id order, and the
     side view reads its horizontal positions from the same slots.
     Edit a slot's x/y to move a node; add node_N rects for more wires (with
     more wires than slots, all wires are spread evenly along the line instead).
     plan   = the area the interpolated field fills
     legend = where the colour bar is drawn
     node_N = top-left and size of one sensor node (a wire's five heights) -->
<g id="Frame 1">
<rect id="plan" x="20" y="20" width="630" height="240" rx="3" stroke="black"/>
<rect id="legend" x="20" y="282" width="300" height="12"/>
<g id="nodes">
<rect id="node_1" x="45" y="78" width="76" height="124" rx="6" stroke="black"/>
<rect id="node_2" x="146" y="78" width="76" height="124" rx="6" stroke="black"/>
<rect id="node_3" x="247" y="78" width="76" height="124" rx="6" stroke="black"/>
<rect id="node_4" x="348" y="78" width="76" height="124" rx="6" stroke="black"/>
<rect id="node_5" x="449" y="78" width="76" height="124" rx="6" stroke="black"/>
<rect id="node_6" x="550" y="78" width="76" height="124" rx="6" stroke="black"/>
</g>
</g>
</svg>
