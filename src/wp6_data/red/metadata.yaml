# Red twin (tomato greenhouse) — device and sensor metadata.
# Device keys match the device_id values from the MySQL tables.

sensor_defaults:
  temp:
    type: "temperature"
    unit: "°C"
    alias: "Temp"
  hum:
    type: "humidity"
    unit: "%RH"
    alias: "Hum"
  temp_ext:
    type: "temperature"
    unit: "°C"
    alias: "Ext Temp"
  hum_ext:
    type: "humidity"
    unit: "%RH"
    alias: "Ext Hum"
  lux:
    type: "illuminance"
    unit: "lx"
    alias: "Lux"
  par:
    type: "photosynthetically active radiation (PAR)"
    unit: "μmol/m²/s"
    alias: "PAR"
  co2:
    type: "CO2 concentration"
    unit: "ppm"
    alias: "CO2"
  air_press:
    type: "pressure"
    unit: "hPa"
    alias: "Pressure"
  wind_sp:
    type: "speed"
    unit: "m/s"
    alias: "Wind Spd"
  wind_dir:
    type: "direction"
    unit: "°"
    alias: "Wind Dir"
  rainfall:
    type: "precipitation"
    unit: "mm"
    alias: "Rain"
  pm25:
    type: "particulate matter"
    unit: "μg/m³"
    alias: "PM2.5"
  pm10:
    type: "particulate matter"
    unit: "μg/m³"
    alias: "PM10"
  adc_ch1:
    type: "dendrometer"
    unit: "V"
    alias: "Dendro CH1"
  adc_ch2:
    type: "dendrometer"
    unit: "V"
    alias: "Dendro CH2"
  adc_ch3:
    type: "dendrometer"
    unit: "V"
    alias: "Dendro CH3"
  battery_pc:
    type: "diagnostics"
    unit: "%"
    alias: "Battery"
  rssi:
    type: "diagnostics"
    unit: "dBm"
    alias: "RSSI"
  snr:
    type: "diagnostics"
    unit: "dB"
    alias: "SNR"

  # ── Sijia / Neurath manual fruit-chemistry measurements ──
  chlorophyll:
    type: "fruit chemistry"
    unit: "index"
    alias: "Chlorophyll"
    source: "sijia"
  flavonoids:
    type: "fruit chemistry"
    unit: "index"
    alias: "Flavonoids"
    source: "sijia"
  anthocyanins:
    type: "fruit chemistry"
    unit: "index"
    alias: "Anthocyanins"
    source: "sijia"
  nfi:
    type: "fruit chemistry"
    unit: "index"
    alias: "NFI"
    source: "sijia"
  water_content:
    type: "fruit chemistry"
    unit: "%"
    alias: "Water Content"
    source: "sijia"
  minerals:
    type: "fruit chemistry"
    unit: "%"
    alias: "Minerals"
    source: "sijia"
  diameter:
    type: "fruit chemistry"
    unit: "mm"
    alias: "Diameter"
    source: "sijia"
  weight:
    type: "fruit chemistry"
    unit: "g"
    alias: "Weight"
    source: "sijia"
  vitamin_c_fresh:
    type: "fruit chemistry"
    unit: "mg/100 g"
    alias: "Vit C (Fresh)"
    source: "sijia"
  vitamin_c_dry:
    type: "fruit chemistry"
    unit: "mg/100 g"
    alias: "Vit C (Dry)"
    source: "sijia"
  total_phenols_fresh:
    type: "fruit chemistry"
    unit: "mg GAE/100 g"
    alias: "Phenols (Fresh)"
    source: "sijia"
  total_phenols_dry:
    type: "fruit chemistry"
    unit: "mg GAE/100 g"
    alias: "Phenols (Dry)"
    source: "sijia"
  antioxidant_capacity_fresh:
    type: "fruit chemistry"
    unit: "mmol TAE/100 g"
    alias: "Antioxidants (Fresh)"
    source: "sijia"
  antioxidant_capacity_dry:
    type: "fruit chemistry"
    unit: "mmol TAE/100 g"
    alias: "Antioxidants (Dry)"
    source: "sijia"

devices:
  "s2100-01-par":
    description: "PAR above lamp level"
    position: "B"
    sensors:
      par:
        intention: "Measures PAR above grow lamp"

  "s2100-02-par":
    description: "PAR at canopy level"
    position: "B"
    sensors:
      par:
        intention: "Measures PAR at plant height"

  "s2101-01-temp-hum":
    position: "B"

  "s2103-01-temp-hum-co2":
    position: "B"

  "s2107-01-temp":
    position: "B"

  "s31-lb-01":
    position: "B"

  "s1000-wetherstation":
    position: "B"

  "dendro-01":
    position: "B"

  "dendro-02":
    position: "B"

  "lht65n-e5":
    position: "B"

  "lht65s-e5-02":
    position: "B"

  "lht65s-ne117":
    position: "B"

  "lht65s-ne117-02":
    position: "B"

  "lht65s-ne117-03":
    position: "B"

  # ── Sijia / Neurath manual measurement plants (one device per cultivar+row) ──
  "neurath-B-2034-strabelina":
    description: "Strabelina cultivar at row 2034"
    position: "B"
    source: "sijia"

  "neurath-B-2012-shivious":
    description: "Shivious cultivar at row 2012"
    position: "B"
    source: "sijia"
