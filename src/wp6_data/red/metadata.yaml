# Red twin (tomato greenhouse) — device and sensor metadata.
# Device keys match the device_id values from the MySQL tables.

# ── Growth sections (red prescriptive view) ──
# Canopy zones mapped 1:1 onto wire heights, in fixed top-to-bottom order, the
# same for every wire (see CONTEXT "Growth section" / red ADR 0002). H1 sits just
# above the canopy; H5 is the root zone. The ordering is a horticultural
# assumption, not a measured distance. List order is the display order (top→root).
# Red-only config — the shared metadata model ignores this key on purpose, so
# shared/ stays twin-agnostic; a red-side loader reads it.
growth_sections:
  - height: 1
    label: "Head"
  - height: 2
    label: "Flowering"
  - height: 3
    label: "Fruit set"
  - height: 4
    label: "Ripening"
  - height: 5
    label: "Substrate"

# ── Risk thresholds (red prescriptive view, issue 014 / ADR 0002) ──
# PROVISIONAL values — retune against real wire data (the engine and CLI exist
# precisely to validate these). Kept in config, not code, so a retune is a YAML
# edit. Red-only; the shared metadata model ignores this key.
risk_thresholds:
  fungal:
    rh_pct: 85           # RH (%) above which an interval counts as "wet"
    window_hours: 24     # trailing window for the wet-hours accumulation
    active_wet_hours: 6  # wet-hours above this opens a fungal-risk episode
  vpd:
    band_min_kpa: 0.4    # healthy VPD band (kPa); below = too humid
    band_max_kpa: 1.2    # above = transpiration stress
  canopy_dli:
    target_mol: 22       # tomato DLI target at the canopy (H1), mol/m²/day
  co2:
    floor_ppm: 400       # daytime CO₂ (ppm) below this = carbon-limited (≈ambient)
    daylight_par: 10     # PAR (µmol/m²/s) above which the floor applies (photoperiod)
  episode:
    min_duration_minutes: 30  # shorter spans are suppressed as flapping

# ── Crop cycles and fruit cohorts (red prescriptive view) ──
# A crop cycle is one planting-to-clearing season. Within it a truss sets every
# `interval_days` and ripens over the summed phase durations, so several fruit
# cohorts are always in flight at once (8, with the values below). Phases are
# declared by growth-section `height`, not by label, so the labels keep a single
# source of truth above and the future move to per-height wire climate is a
# config edit rather than a redesign (see red CONTEXT "Cohort phase").
# PROVISIONAL — the phase split and especially the cycle dates are horticultural
# assumptions awaiting confirmation from Neurath/WP1; the view reports any Sijia
# measurement that attaches to no cohort, which is the signal these are wrong.
# Red-only; the shared metadata model ignores this key.
crop_cycles:
  cohort:
    interval_days: 7       # a new truss sets each week
    duration_weeks: 8      # anthesis→harvest; PROVISIONAL, awaiting WP1
  climate:
    # The (device, sensor) pairs a cohort's exposure is aggregated from. These
    # are the greenhouse-level sensors because the multi-height wire only began
    # reporting after the current Sijia season ended, so the two do not yet
    # overlap. Swapping a metric onto WS_01_0N-hN needs no code change.
    metrics:
      - key: temp
        label: "Mean temperature"
        unit: "°C"
        device: s2101-01-temp-hum
        sensor: temp
        agg: avg
      - key: hum
        label: "Mean humidity"
        unit: "%RH"
        device: s2101-01-temp-hum
        sensor: hum
        agg: avg
      - key: co2
        label: "Mean CO₂"
        unit: "ppm"
        device: s2103-01-temp-hum-co2
        sensor: co2
        agg: avg
      - key: par
        label: "Mean PAR (total light)"
        unit: "μmol/m²/s"
        device: s2100-02-par
        sensor: par
        agg: avg
  cycles:
    - label: "2025 autumn"
      start: 2025-06-16    # PROVISIONAL
      end: 2025-12-08      # PROVISIONAL
    - label: "2026 spring"
      start: 2026-01-05    # PROVISIONAL
      end: 2026-06-29      # PROVISIONAL

# ── Wire uniformity (red cross-wire view) ──
# What it takes for the declared wires to be "reading the same thing". Growth
# sections map onto the same heights on every wire (see CONTEXT "Growth
# section"), so H3 on one wire is directly comparable to H3 on another — these
# numbers say how far apart they may drift before that is worth reporting.
# PROVISIONAL: horticultural/instrument judgement, not measured. Retune once
# three wires have been seen side by side. Red-only; the shared metadata model
# ignores this key.
uniformity:
  # A wire reporting less than this on the shown day is excluded from the
  # spread and said so, rather than averaged in and reading as agreement.
  min_coverage_hours: 12
  # Per metric, the spread at which the tint saturates — and the same number
  # decides whether a wire is offset, divergent, or in agreement.
  notable_spread:
    par: 50        # µmol/m²/s
    temp: 1.0      # °C
    hum: 5.0       # %RH
    co2: 50        # ppm
    dli: 2.0       # mol/m²
    vpd: 0.15      # kPa
    fungal: 2.0    # h

# ── Climate model: weather → greenhouse level → per-height wire ──
# Three links, each trained where the data supports it. Links 1-2 have ~9.7
# months across a full seasonal cycle; link 3 (the per-height deviation) has
# only the wire history, which is summer-only — hence no day-of-year feature
# there. Evidence for every date and sensor choice below is in
# docs/red/wire-data-coverage.md (probed 2026-09-16).
# Red-only; the shared metadata model ignores this key.
climate_model:
  # Earliest date any link may train from: the first greenhouse-level reading.
  # Supersedes the former DEFAULT_TRAINING_START code constant.
  training_start: 2025-10-08

  # Outdoor reference. A full weather station, not just the lux source the DLI
  # model uses it for.
  outdoor:
    device: s1000-wetherstation
    sensors: [temp, hum, lux, wind_sp]

  # Greenhouse-level reference that per-height deviations are measured against.
  # Both candidates are fitted and compared: s2101 is what crop_cycles uses,
  # s2103 is the steadier of the two (mean daily range 11-18°C vs 23-30°C, and
  # no >50°C maxima). Which one wins is reported, not assumed.
  references:
    - key: s2103
      device: s2103-01-temp-hum-co2
      sensors: {temp: temp, hum: hum, co2: co2}
    - key: s2101
      device: s2101-01-temp-hum
      sensors: {temp: temp, hum: hum}
  # Light needs two references, because canopy PAR is part weather and part
  # operator decision. Link 2 predicts the NATURAL part from weather (the
  # above-lamp sensor); the lamp contribution is observed and added back before
  # link 3, whose reference stays the canopy sensor — like-for-like with the
  # wire PAR sensors, which also hang under the lamps. See MODEL_PAPER §7.5 and
  # dli/MODEL_PAPER.md §5.1 for why predicting the canopy sensor from weather
  # does not work.
  par:
    natural:
      device: s2100-01-par
      sensor: par
    canopy:
      device: s2100-02-par
      sensor: par

  # Hourly resolution; horizons in hours ahead.
  # Every horizon listed here is a separately fitted and separately scored
  # model — not interpolation — so adding one costs a fit per target and a
  # row on the model page.
  #
  # Dense at the front, where indoor climate turns over in a few hours, and
  # dense again from 12h out: skill against persistence collapses at the
  # multiples of 24h, where "same time yesterday" is a strong guess, and
  # recovers in between. Three-hourly through that range resolves the shape
  # of the dip rather than just its existence.
  horizons_hours: [1, 2, 3, 4, 6, 8, 12, 15, 18, 21, 24, 27, 30, 33, 36, 42, 48]
  # Lags of the indoor state, in hours, available at prediction time.
  lag_hours: [1, 2, 3, 6, 12, 24]

  # Link 3 seasonality is not configured: each (wire, measurement, height) is
  # fitted both with and without a day-of-year term and the better out-of-fold
  # score wins. Measured, because the answer differs by measurement — see
  # climate/MODEL_PAPER.md §5.4.
  # Reference PAR (µmol/m²/s) below which the per-height light ratio is not
  # fitted: at night the ratio is a division by noise, not an attenuation.
  par_floor: 5.0

  # Spans excluded from every fit. PROVISIONAL — the dates are measured, the
  # *cause* is not confirmed. Correct the reason here, not in code.
  exclusions:
    - start: 2026-05-28
      end: 2026-07-13          # exclusive; normal behaviour resumes 2026-07-13
      reason: >-
        Greenhouse-level sensors s2101 and s2103 both flatlined to 0.2-1.5°C of
        daily range (normal: 6-30°C) with sharp boundaries, while the wires read
        outdoor-like values. Spans the declared end of the 2026 spring crop
        cycle, so an empty house during changeover is the likely cause — UNCONFIRMED,
        awaiting Neurath/WP1.

  # Per-wire, per-measurement availability. Each wire is broken differently, so
  # link 3 must not assume a wire reports everything. See the coverage doc.
  wire_availability:
    WS_01_01:
      from: 2026-07-16
      temp: [1, 2, 3, 4, 5]
      hum: [1, 2, 3, 4, 5]
      co2: [1, 2, 3, 4, 5]
      par: [5]               # H1-H4 PAR dead since 2026-08
    WS_01_02:
      from: 2026-07-13
      temp: [1, 2, 3, 4, 5]
      hum: [1, 2, 3, 4, 5]
      co2: [1, 2, 3, 4, 5]
      par: [1, 2, 3, 4, 5]   # the only complete wire
    WS_01_03:
      from: 2026-07-13
      temp: []               # temp/hum/co2 dead since 2026-08
      hum: []
      co2: []
      par: [1, 2, 3, 5]

sensor_defaults:
  temp:
    type: "temperature"
    unit: "°C"
    alias: "Temp"
  hum:
    type: "humidity"
    unit: "%RH"
    alias: "Hum"
  temp_ext:
    type: "temperature"
    unit: "°C"
    alias: "Ext Temp"
  hum_ext:
    type: "humidity"
    unit: "%RH"
    alias: "Ext Hum"
  lux:
    type: "illuminance"
    unit: "lx"
    alias: "Lux"
  par:
    type: "photosynthetically active radiation (PAR)"
    unit: "μmol/m²/s"
    alias: "PAR"
  rad:
    # Unit unconfirmed with WP1; the column is decimal(5,0), so it cannot carry a
    # fractional value. W/m² is the only listed unit that fits an integer range.
    type: "solar radiation"
    unit: "W/m²"
    alias: "Solar radiation"
  co2:
    type: "CO2 concentration"
    unit: "ppm"
    alias: "CO2"
  air_press:
    type: "pressure"
    unit: "hPa"
    alias: "Pressure"
  wind_sp:
    type: "speed"
    unit: "m/s"
    alias: "Wind Spd"
  wind_dir:
    type: "direction"
    unit: "°"
    alias: "Wind Dir"
  rainfall:
    type: "precipitation"
    unit: "mm"
    alias: "Rain"
  pm25:
    type: "particulate matter"
    unit: "μg/m³"
    alias: "PM2.5"
  pm10:
    type: "particulate matter"
    unit: "μg/m³"
    alias: "PM10"
  adc_ch1:
    type: "dendrometer"
    unit: "V"
    alias: "Dendro CH1"
  adc_ch2:
    type: "dendrometer"
    unit: "V"
    alias: "Dendro CH2"
  adc_ch3:
    type: "dendrometer"
    unit: "V"
    alias: "Dendro CH3"
  battery_pc:
    type: "diagnostics"
    unit: "%"
    alias: "Battery"
  rssi:
    type: "diagnostics"
    unit: "dBm"
    alias: "RSSI"
  snr:
    type: "diagnostics"
    unit: "dB"
    alias: "SNR"

