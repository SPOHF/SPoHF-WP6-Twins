# Red twin (tomato greenhouse) — device and sensor metadata.
# Device keys match the device_id values from the MySQL tables.

# ── Growth sections (red prescriptive view) ──
# Canopy zones mapped 1:1 onto wire heights, in fixed top-to-bottom order, the
# same for every wire (see CONTEXT "Growth section" / red ADR 0002). H1 sits just
# above the canopy; H5 is the root zone. The ordering is a horticultural
# assumption, not a measured distance. List order is the display order (top→root).
# Red-only config — the shared metadata model ignores this key on purpose, so
# shared/ stays twin-agnostic; a red-side loader reads it.
growth_sections:
  - height: 1
    label: "Head"
  - height: 2
    label: "Flowering"
  - height: 3
    label: "Fruit set"
  - height: 4
    label: "Ripening"
  - height: 5
    label: "Substrate"

# ── Risk thresholds (red prescriptive view, issue 014 / ADR 0002) ──
# PROVISIONAL values — retune against real wire data (the engine and CLI exist
# precisely to validate these). Kept in config, not code, so a retune is a YAML
# edit. Red-only; the shared metadata model ignores this key.
risk_thresholds:
  fungal:
    rh_pct: 85           # RH (%) above which an interval counts as "wet"
    window_hours: 24     # trailing window for the wet-hours accumulation
    active_wet_hours: 6  # wet-hours above this opens a fungal-risk episode
  vpd:
    band_min_kpa: 0.4    # healthy VPD band (kPa); below = too humid
    band_max_kpa: 1.2    # above = transpiration stress
  canopy_dli:
    target_mol: 22       # tomato DLI target at the canopy (H1), mol/m²/day
  co2:
    floor_ppm: 400       # daytime CO₂ (ppm) below this = carbon-limited (≈ambient)
    daylight_par: 10     # PAR (µmol/m²/s) above which the floor applies (photoperiod)
  episode:
    min_duration_minutes: 30  # shorter spans are suppressed as flapping

# ── Crop cycles and fruit cohorts (red prescriptive view) ──
# A crop cycle is one planting-to-clearing season. Within it a truss sets every
# `interval_days` and ripens over the summed phase durations, so several fruit
# cohorts are always in flight at once (8, with the values below). Phases are
# declared by growth-section `height`, not by label, so the labels keep a single
# source of truth above and the future move to per-height wire climate is a
# config edit rather than a redesign (see red CONTEXT "Cohort phase").
# PROVISIONAL — the phase split and especially the cycle dates are horticultural
# assumptions awaiting confirmation from Neurath/WP1; the view reports any Sijia
# measurement that attaches to no cohort, which is the signal these are wrong.
# Red-only; the shared metadata model ignores this key.
crop_cycles:
  cohort:
    interval_days: 7       # a new truss sets each week
    duration_weeks: 8      # anthesis→harvest; PROVISIONAL, awaiting WP1
  climate:
    # The (device, sensor) pairs a cohort's exposure is aggregated from. These
    # are the greenhouse-level sensors because the multi-height wire only began
    # reporting after the current Sijia season ended, so the two do not yet
    # overlap. Swapping a metric onto WS_01_0N-hN needs no code change.
    metrics:
      - key: temp
        label: "Mean temperature"
        unit: "°C"
        device: s2101-01-temp-hum
        sensor: temp
        agg: avg
      - key: hum
        label: "Mean humidity"
        unit: "%RH"
        device: s2101-01-temp-hum
        sensor: hum
        agg: avg
      - key: co2
        label: "Mean CO₂"
        unit: "ppm"
        device: s2103-01-temp-hum-co2
        sensor: co2
        agg: avg
      - key: par
        label: "Mean PAR (total light)"
        unit: "μmol/m²/s"
        device: s2100-02-par
        sensor: par
        agg: avg
      # Hours the canopy sensor reads above the DLI photoperiod threshold: the
      # day minus the time all light (sun and lamps) is off. Derived from raw
      # readings, since a daily bucket cannot recover time-above-threshold.
      - key: day_length
        label: "Day length"
        unit: "h"
        device: s2100-02-par
        sensor: par
        agg: avg
        derive: day_length
  cycles:
    - label: "2025 autumn"
      start: 2025-06-16    # PROVISIONAL
      end: 2025-12-08      # PROVISIONAL
    - label: "2026 spring"
      start: 2026-01-05    # PROVISIONAL
      end: 2026-06-29      # PROVISIONAL

# ── Wire uniformity (red cross-wire view) ──
# What it takes for the declared wires to be "reading the same thing". Growth
# sections map onto the same heights on every wire (see CONTEXT "Growth
# section"), so H3 on one wire is directly comparable to H3 on another — these
# numbers say how far apart they may drift before that is worth reporting.
# PROVISIONAL: horticultural/instrument judgement, not measured. Retune once
# three wires have been seen side by side. Red-only; the shared metadata model
# ignores this key.
uniformity:
  # A wire reporting less than this on the shown day is excluded from the
  # spread and said so, rather than averaged in and reading as agreement.
  min_coverage_hours: 12
  # Per metric, the spread at which the tint saturates — and the same number
  # decides whether a wire is offset, divergent, or in agreement.
  notable_spread:
    par: 50        # µmol/m²/s
    temp: 1.0      # °C
    hum: 5.0       # %RH
    co2: 50        # ppm
    dli: 2.0       # mol/m²
    vpd: 0.15      # kPa
    fungal: 2.0    # h

# ── Climate model: weather → greenhouse level → per-height wire ──
# Three links, each trained where the data supports it. Links 1-2 have ~9.7
# months across a full seasonal cycle; link 3 (the per-height deviation) has
# only the wire history, which is summer-only — hence no day-of-year feature
# there. Evidence for every date and sensor choice below is in
# docs/red/wire-data-coverage.md (probed 2026-09-16).
# Red-only; the shared metadata model ignores this key.
climate_model:
  # Earliest date any link may train from: the first greenhouse-level reading.
  # Supersedes the former DEFAULT_TRAINING_START code constant.
  training_start: 2025-10-08

  # Outdoor reference. A full weather station, not just the lux source the DLI
  # model uses it for.
  outdoor:
    device: s1000-wetherstation
    sensors: [temp, hum, lux, wind_sp]

  # Greenhouse-level reference that per-height deviations are measured against.
  # Both candidates are fitted and compared: s2101 is what crop_cycles uses,
  # s2103 is the steadier of the two (mean daily range 11-18°C vs 23-30°C, and
  # no >50°C maxima). Which one wins is reported, not assumed.
  references:
    - key: s2103
      device: s2103-01-temp-hum-co2
      sensors: {temp: temp, hum: hum, co2: co2}
    - key: s2101
      device: s2101-01-temp-hum
      sensors: {temp: temp, hum: hum}
  # Light needs two references, because canopy PAR is part weather and part
  # operator decision. Link 2 predicts the NATURAL part from weather (the
  # above-lamp sensor); the lamp contribution is observed and added back before
  # link 3, whose reference stays the canopy sensor — like-for-like with the
  # wire PAR sensors, which also hang under the lamps. See MODEL_PAPER §7.5 and
  # dli/MODEL_PAPER.md §5.1 for why predicting the canopy sensor from weather
  # does not work.
  par:
    natural:
      device: s2100-01-par
      sensor: par
    canopy:
      device: s2100-02-par
      sensor: par

  # Hourly resolution; horizons in hours ahead.
  # Every horizon listed here is a separately fitted and separately scored
  # model — not interpolation — so adding one costs a fit per target and a
  # row on the model page.
  #
  # Dense at the front, where indoor climate turns over in a few hours, and
  # dense again from 12h out: skill against persistence collapses at the
  # multiples of 24h, where "same time yesterday" is a strong guess, and
  # recovers in between. Three-hourly through that range resolves the shape
  # of the dip rather than just its existence.
  horizons_hours: [1, 2, 3, 4, 6, 8, 12, 15, 18, 21, 24, 27, 30, 33, 36, 42, 48]
  # Lags of the indoor state, in hours, available at prediction time.
  lag_hours: [1, 2, 3, 6, 12, 24]

  # Link 3 seasonality is not configured: each (wire, measurement, height) is
  # fitted both with and without a day-of-year term and the better out-of-fold
  # score wins. Measured, because the answer differs by measurement — see
  # climate/MODEL_PAPER.md §5.4.
  # Reference PAR (µmol/m²/s) below which the per-height light ratio is not
  # fitted: at night the ratio is a division by noise, not an attenuation.
  par_floor: 5.0

  # Spans excluded from every fit. PROVISIONAL — the dates are measured, the
  # *cause* is not confirmed. Correct the reason here, not in code.
  exclusions:
    - start: 2026-05-28
      end: 2026-07-13          # exclusive; normal behaviour resumes 2026-07-13
      reason: >-
        Greenhouse-level sensors s2101 and s2103 both flatlined to 0.2-1.5°C of
        daily range (normal: 6-30°C) with sharp boundaries, while the wires read
        outdoor-like values. Spans the declared end of the 2026 spring crop
        cycle, so an empty house during changeover is the likely cause — UNCONFIRMED,
        awaiting Neurath/WP1.

# Where LetsGrow reports the grow lights (red/lamp.py `LampStatusConfig`).
# LetsGrow switches the lamps, so this is when and at what share they ran —
# not how much light they put on a sensor, which is still measured from PAR.
# `lg_led1_on` is not listed: over Oct 2025 - Nov 2026 it was never on without
# the assimilation lighting, so the two act as one installation.
lamps:
  device: "letsgrow-grow-light-b4"
  switch: lg_assim_light_on
  share: lg_assim_light_pct

# Where LetsGrow reports sunlight (red/lamp.py `DaylightConfig`), for telling
# day from night on /dli/lamps. The outdoor station rather than red's roof PAR
# sensor: it goes back to 2023, and it sees no lamp spill. It logs whole W/m²,
# so dim twilight reads exactly 0 and "any radiation" is the bar. Against the
# roof sensor at 5 µmol/m²/s it agreed on 96.9% of hours (Oct 2025 - Nov 2026);
# the rest are dawn and dusk hours where the roof read more light than reached
# the station — lamp spill, not sun.
daylight:
  device: "letsgrow-weather-station"
  radiation: lg_rad
  threshold: 0

# How hard the heating ran (red/heating.py `HeatOutputConfig`), for /energy.
# A heating pipe gives off heat roughly in proportion to
# (pipe temperature - air temperature)^exponent, the standard pipe heat-transfer
# relation, so summing that over the circuits and the hours follows gas use.
# Relative only: the circuits are weighted equally, and no pipe length,
# diameter, boiler efficiency or gas price is in it yet. LetsGrow has no
# heating on/off: the pipes run ~22-24 h/day all year (minimum-pipe operation),
# so hours alone do not follow cost — how hot they ran does.
heating:
  device: "letsgrow-climate-b4"
  air: lg_temp_greenhouse
  pipes: [lg_pipe_lower, lg_pipe_growth]
  exponent: 1.25
  # °C. A pipe reading above this is a sensor fault, not heat: a hot-water loop
  # stays under ~95 °C, and the real maximum seen is ~85. The growing pipe read
  # exactly 150 for 31 h on 30 Jun - 1 Jul 2024, which drew as the year's
  # hottest heating day. Such readings are dropped, so those days are a gap.
  max_pipe: 95

# The greenhouse page's physics (red/greenhouse, CONTEXT "Heat balance"): a
# quasi-steady energy and vapour balance per time step, from LetsGrow's state.
# Every number is either CALIBRATED on red's own data (with the script that did
# it) or LITERATURE (with the source) — see scripts/red_operations/calibrate_physics.py
# and greenhouse/references.yaml.
greenhouse:
  devices:
    climate: "letsgrow-climate-b4"
    lamps: "letsgrow-grow-light-b4"
    water: "letsgrow-water-b4"
    weather: "letsgrow-weather-station"
  cover:
    # LITERATURE: share of outdoor global radiation entering a glasshouse
    # (glass and structure), the same ~70% the grower's lamp sheet assumes.
    transmission: 0.70
    # CALIBRATED: W per m² floor per K, on closed, dark, lamp-free, steady nights
    # 2023-26 (median 4.7-4.8), against the pipe heat estimated below — so it is
    # consistent with that estimate rather than with a handbook glass U-value.
    u_open: 4.8
    # LITERATURE: outside convection grows with wind (Vanthoor 2011); red's
    # station data could not resolve it (wind was rarely high on closed nights).
    u_wind: 0.15
    # ASSUMED: share of cover loss a closed energy screen saves while closed.
    # No verified source for 0.40 (an earlier "de Zwart 2010" attribution did
    # not check out on 2026-11-26; annual savings of a single screen, a
    # different measure, are reported lower). Red's curtain is logged only
    # since 2026-05-21: too few closed, vents-shut nights to measure it yet.
    screen_saving: 0.40
    # ASSUMED: light a closed energy screen lets through.
    screen_transmission: 0.75
    # LITERATURE: share of the sun entering that the crop and floor reflect
    # back out through the glass — a closed canopy reflects ~5% of PAR and ~40%
    # of near-infrared (scattering coefficients 0.2 and 0.8, Goudriaan & van
    # Laar 1994), a fifth to a quarter of the total.
    reflected_share: 0.25
    # LITERATURE: cover temperature sits ~30% of the way from outside to inside
    # air; vapour condenses on it below the dew point, at this mass-transfer
    # rate (m/s, from h ≈ 3.5 W/m²K over ρc_p).
    cover_temperature_share: 0.3
    condensation_rate: 0.003
  # CALIBRATED: ventilation (m³ air per m² floor per s) against mean vent
  # opening (0-1), from the vapour balance E ≈ g·(AH_in − AH_out) on hours with
  # scale-measured transpiration and a cover too warm to condense (2023-26,
  # ~5,000 hours). Medians per opening band; interpolated between.
  ventilation:
    opening: [0.0, 0.06, 0.20, 0.45, 0.80, 1.0]
    rate: [0.0021, 0.0034, 0.0060, 0.0105, 0.0135, 0.0150]
  lamps:
    par: 257.3           # µmol/m²/s at 100%, grower's Block B sheet
    radiation_eq: 64.46  # J/cm² outdoor-equivalent per full lamp-hour, same sheet
    # ASSUMED: LED efficacy is not on the sheet. Used only for the lamps' heat
    # in the balance (all electrical power ends as heat); no energy bills.
    efficacy: 3.0
  pipes:
    # ASSUMED geometry (GreenLight's reference greenhouse; red's own pipes are not
    # confirmed): heat after Bot (1983)
    # convection 1.99·π·d·L·ΔT^1.32 plus long-wave radiation.
    - tag: lg_pipe_lower
      label: "Pipe rail (lower circuit)"
      diameter: 0.051
      length: 1.25
    - tag: lg_pipe_growth
      label: "Growth pipe"
      diameter: 0.035
      length: 1.655
  # CALIBRATED: the substrate scale gains 4.0-4.3 kg per l/m² irrigated, so it
  # weighs ~4 m² of crop; between pulses −ΔW/4 is transpiration.
  scale_area_m2: 4.0
  # CALIBRATED (OLS on ~17,000 clean scale-hours, 2023-26): the transpiration
  # shape used between clean scale readings, ml/m²/h. Weak hour by hour
  # (R² 0.17); the day's total always comes from the water balance instead.
  transpiration:
    intercept: 32.3
    per_sun_w: 0.149     # per W/m² of sun inside
    per_lamp_w: 0.609    # per W/m² of lamp power
    per_hd: 1.602        # per g/m³ humidity deficit
    per_pipe_w: 0.123    # per W/m² of pipe heat
  advice:
    light_target_jcm2: 1000   # the grower's rule
    dark_min_h: 6             # the grower's rule
    wake_lamp_h: 0.5          # activity lost per switch-on (substrate scale)
    sun_max_w: 300            # no lamps above this outside radiation
    humid_rh: 90              # RH counted as humid
    humid_hours_target: 3     # a day above this is humid; far below costs heat
    vent_open_pct: 10         # vents count as open above this
    dry_rh: 85                # below this, venting is not for humidity
    co2_lamp_floor_ppm: 600   # CO₂ in lamp hours below this flags light-use
  # The multi-height wires as one vertical cross-section of the house (the
  # page's microclimate mode). ASSUMED geometry, awaiting a site measurement:
  # the wires hang in one row roughly 10-15 m apart, and the sensor heights are
  # spread evenly from the substrate (H5) to just above the canopy (H1). The
  # page interpolates between these points in metres, so retuning is a YAML
  # edit. Which wires are installed still comes from upstream's map.
  microclimate:
    runs: along_rows          # the row of wires follows the crop rows
    wires:                    # list order = order along the row
      - {id: WS_01_02, at_m: 0}
      - {id: WS_01_03, at_m: 12.5}
      - {id: WS_01_01, at_m: 25}
    heights_m: {1: 4.0, 2: 3.2, 3: 2.4, 4: 1.6, 5: 0.8}
    metrics: [temp, hum, vpd, co2, par]
  # Where each number above comes from, as the /greenhouse page shows it next to
  # the value ("configured" popups): calibrated on red's data, literature,
  # assumed, the grower's own figure or rule, or a threshold the twin chose.
  # A block name covers all its settings unless a setting is listed itself.
  provenance:
    cover.transmission: literature
    cover.u_open: calibrated
    cover.u_wind: literature
    cover.screen_saving: assumed
    cover.screen_transmission: assumed
    cover.reflected_share: literature
    cover.cover_temperature_share: literature
    cover.condensation_rate: literature
    ventilation: calibrated
    lamps.par: grower
    lamps.radiation_eq: grower
    lamps.efficacy: assumed
    pipes: assumed
    scale_area_m2: calibrated
    transpiration: calibrated
    advice.light_target_jcm2: grower
    advice.dark_min_h: grower
    advice.wake_lamp_h: calibrated
    advice.sun_max_w: twin
    advice.humid_rh: twin
    advice.humid_hours_target: twin
    advice.vent_open_pct: twin
    advice.dry_rh: twin
    advice.co2_lamp_floor_ppm: twin
    microclimate.runs: assumed
    microclimate.wires: assumed
    microclimate.heights_m: assumed

sensor_defaults:
  temp:
    type: "temperature"
    unit: "°C"
    alias: "Temp"
  hum:
    type: "humidity"
    unit: "%RH"
    alias: "Hum"
  temp_ext:
    type: "temperature"
    unit: "°C"
    alias: "Ext Temp"
  hum_ext:
    type: "humidity"
    unit: "%RH"
    alias: "Ext Hum"
  lux:
    type: "illuminance"
    unit: "lx"
    alias: "Lux"
  par:
    type: "photosynthetically active radiation (PAR)"
    unit: "μmol/m²/s"
    alias: "PAR"
  rad:
    # Unit unconfirmed with WP1; the column is decimal(5,0), so it cannot carry a
    # fractional value. W/m² is the only listed unit that fits an integer range.
    type: "solar radiation"
    unit: "W/m²"
    alias: "Solar radiation"
  co2:
    type: "CO2 concentration"
    unit: "ppm"
    alias: "CO2"
  air_press:
    type: "pressure"
    unit: "hPa"
    alias: "Pressure"
  wind_sp:
    type: "speed"
    unit: "m/s"
    alias: "Wind Spd"
  wind_dir:
    type: "direction"
    unit: "°"
    alias: "Wind Dir"
  rainfall:
    type: "precipitation"
    unit: "mm"
    alias: "Rain"
  pm25:
    type: "particulate matter"
    unit: "μg/m³"
    alias: "PM2.5"
  pm10:
    type: "particulate matter"
    unit: "μg/m³"
    alias: "PM10"
  adc_ch1:
    type: "dendrometer"
    unit: "V"
    alias: "Dendro CH1"
  adc_ch2:
    type: "dendrometer"
    unit: "V"
    alias: "Dendro CH2"
  adc_ch3:
    type: "dendrometer"
    unit: "V"
    alias: "Dendro CH3"
  battery_pc:
    type: "diagnostics"
    unit: "%"
    alias: "Battery"
  rssi:
    type: "diagnostics"
    unit: "dBm"
    alias: "RSSI"
  snr:
    type: "diagnostics"
    unit: "dB"
    alias: "SNR"

  # ── Sijia / Neurath manual fruit-chemistry measurements ──
  chlorophyll:
    type: "fruit chemistry"
    unit: "index"
    alias: "Chlorophyll"
    source: "sijia"
  flavonoids:
    type: "fruit chemistry"
    unit: "index"
    alias: "Flavonoids"
    source: "sijia"
  anthocyanins:
    type: "fruit chemistry"
    unit: "index"
    alias: "Anthocyanins"
    source: "sijia"
  nfi:
    type: "fruit chemistry"
    unit: "index"
    alias: "NFI"
    source: "sijia"
  water_content:
    type: "fruit chemistry"
    unit: "%"
    alias: "Water Content"
    source: "sijia"
  brix:
    type: "fruit chemistry"
    unit: "°Brix"
    alias: "Brix"
