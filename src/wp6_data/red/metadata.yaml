    source: "sijia"
  diameter:
    type: "fruit chemistry"
    unit: "mm"
    alias: "Diameter"
    source: "sijia"
  weight:
    type: "fruit chemistry"
    unit: "g"
    alias: "Weight"
    source: "sijia"
  vitamin_c_fresh:
    type: "fruit chemistry"
    unit: "mg/100 g"
    alias: "Vit C (Fresh)"
    source: "sijia"
  vitamin_c_dry:
    type: "fruit chemistry"
    unit: "mg/100 g"
    alias: "Vit C (Dry)"
