  antioxidant_capacity_dry:
    type: "fruit chemistry"
    unit: "mmol TAE/100 g"
    alias: "Antioxidants (Dry)"
    source: "sijia"

  # ── LetsGrow (Neurath's climate computer, relayed by SPoHF) ──
  # Synced by `letsgrow-data` (red/letsgrow.py maps col_id -> tag). The `lg_`
  # prefix keeps every tag clear of the legacy MySQL tags, because red routes
  # to TimescaleDB by tag. `agg: max` marks LetsGrow's daily running totals,
  # which climb through the day and reset at midnight.
  lg_temp_greenhouse:
    type: "temperature"
    unit: "°C"
    alias: "LG Temp greenhouse"
    source: "letsgrow"
  lg_rh_greenhouse:
    type: "humidity"
    unit: "%RH"
    alias: "LG RH greenhouse"
    source: "letsgrow"
  lg_abs_hum_greenhouse:
    type: "absolute humidity"
    unit: "g/m³"
    alias: "LG Abs hum greenhouse"
    source: "letsgrow"
  lg_hum_deficit_greenhouse:
    type: "humidity deficit"
    unit: "g/m³"
    alias: "LG Hum deficit greenhouse"
    source: "letsgrow"
  lg_vpd:
    type: "vapour pressure deficit"
    unit: "kPa"
    alias: "LG VPD"
    source: "letsgrow"
  lg_par:
    type: "photosynthetically active radiation (PAR)"
    unit: "μmol/m²/s"
    alias: "LG PAR"
    source: "letsgrow"
  lg_par_sum:
    type: "PAR sum (daily, cumulative)"
    unit: "mol/m²"
    alias: "LG PAR sum"
    agg: max
    source: "letsgrow"
  lg_co2:
    type: "CO₂"
    unit: "ppm"
    alias: "LG CO₂"
    source: "letsgrow"
  lg_co2_kg:
    type: "CO₂ dosing"
    unit: "kg"
    alias: "LG CO₂ (kg)"
    source: "letsgrow"
  lg_heating_setpoint:
    type: "setpoint"
    unit: "°C"
    alias: "LG Heating setpoint"
    source: "letsgrow"
  lg_pipe_lower:
    type: "pipe temperature"
    unit: "°C"
    alias: "LG Lower circuit"
    source: "letsgrow"
  lg_pipe_lower_calc:
    type: "pipe temperature (calc)"
    unit: "°C"
    alias: "LG Lower circuit calc"
    source: "letsgrow"
  lg_pipe_growth:
    type: "pipe temperature"
    unit: "°C"
    alias: "LG Growth circuit"
    source: "letsgrow"
  lg_pipe_growth_calc:
    type: "pipe temperature (calc)"
    unit: "°C"
    alias: "LG Growth circuit calc"
    source: "letsgrow"
  lg_vent_lee:
