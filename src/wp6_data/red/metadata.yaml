  # ── Multi-height wire sensor (WS_01_01): 4 measurements × 5 heights ──
  # Each height is its own device, served from the wide wire_sensors table
  # (see red ADR 0001). Replaces the retired PAR-only s2100-10..15 sensors.
  # The "-h0" device is the solar-radiation sensor hanging above H1: one per
  # wire, so it reports `rad` alone and no growth section maps onto it.
  "WS_01_01-h0":
    description: "Multi-height wire — solar radiation, above H1"
    position: "B"
    type: "wire"
    sensors:
      rad: {}

