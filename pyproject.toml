[project]
name = "wp6-data"
version = "0.1.0"
description = "SPoHF WP6 Sensor Data Sync & Dashboards"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.2",
    "authlib>=1.3",
    "cachetools>=5.5",
    "fastapi>=0.128.0",
    "httpx>=0.28",
    "itsdangerous>=2.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "plotly>=6.5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.6",
    "structlog>=25.1",
    "tenacity>=9.0",
    "uvicorn>=0.40.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
]

[project.scripts]
wp6-data-sync = "wp6_data.__main__:main"
wp6-red-export = "wp6_data.red.export:main"
wp6-blue-export = "wp6_data.blue.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "1 week"

[tool.hatch.build.targets.wheel]
packages = ["src/wp6_data"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--ignore=tests/e2e"
markers = ["e2e: end-to-end tests requiring TimescaleDB"]

