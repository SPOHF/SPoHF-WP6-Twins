[project]
name = "wp6-data"
version = "0.1.0"
description = "SPoHF WP6 Sensor Data Sync - Yookr API to Neo4j"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "httpx>=0.28",
    "neo4j>=5.27",
    "pandas>=3.0.0",
    "plotly>=6.5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dateutil>=2.9.0.post0",
    "structlog>=25.1",
    "tenacity>=9.0",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
wp6-data-sync = "wp6_data.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wp6_data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
