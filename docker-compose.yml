services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: wp6-timescale
    ports:
      - "5432:5432"  # PostgreSQL
    environment:
      - POSTGRES_DB=sensordb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=localdevpassword
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sensordb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescale_data:
