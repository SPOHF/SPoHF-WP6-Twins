{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-blue-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-blue-dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-blue-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-blue-dashboard
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: WP6_NEO4J_URI
              value: "bolt://{{ .Chart.Name }}-neo4j:7687"
            - name: WP6_NEO4J_USER
              value: "neo4j"
            - name: WP6_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Chart.Name) }}
                  key: neo4j-password
            - name: WP6_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Chart.Name) }}
                  key: oidc-client-secret
            - name: WP6_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Chart.Name) }}
                  key: oidc-session-secret
            - name: WP6_OIDC_REDIRECT_BASE
              value: {{ printf "https://%s" .Values.dashboard.ingress.host | quote }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 18
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-blue-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-blue-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-blue-dashboard
{{- if .Values.dashboard.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-blue-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-blue-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.dashboard.ingress.host }}
      secretName: {{ .Chart.Name }}-blue-dashboard-tls
  rules:
    - host: {{ .Values.dashboard.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}-blue-dashboard
                port:
                  name: http
{{- end }}
{{- end }}
