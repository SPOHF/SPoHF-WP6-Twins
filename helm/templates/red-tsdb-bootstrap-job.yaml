{{- if .Values.red.enabled }}
{{- include "wp6-data.tsdbBootstrapJob" (dict
      "root" $
      "twin" "red"
      "database" "wp6_red"
      "role" "wp6_red"
      "roleSecret" (.Values.red.secrets.existingSecret | default (printf "%s-red-secrets" .Chart.Name))
      "roleSecretKey" "tsdb-red-password"
    ) }}
{{- end }}
