{{- if .Values.neo4j.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Chart.Name }}-neo4j
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-neo4j
spec:
  serviceName: {{ .Chart.Name }}-neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          command: ["/bin/bash", "-c"]
          args:
            - export NEO4J_AUTH="neo4j/$DB_PASSWORD" && exec tini -g -- /startup/docker-entrypoint.sh neo4j
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-secrets
                  key: neo4j-password
            - name: NEO4J_dbms_memory_heap_initial__size
              value: "256m"
            - name: NEO4J_dbms_memory_heap_max__size
              value: "512m"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-neo4j
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-neo4j
spec:
  type: ClusterIP
  ports:
    - port: 7474
      targetPort: 7474
      name: http
    - port: 7687
      targetPort: 7687
      name: bolt
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-neo4j
{{- end }}
