{{- if .Values.sync.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-sync
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-sync
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}-sync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "wp6_data"]
              env:
                - name: WP6_API_BASE_URL
                  value: {{ .Values.api.baseUrl | quote }}
                - name: WP6_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Chart.Name) }}
                      key: api-token
                - name: WP6_NEO4J_URI
                  value: "bolt://{{ .Chart.Name }}-neo4j:7687"
                - name: WP6_NEO4J_USER
                  value: "neo4j"
                - name: WP6_NEO4J_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Chart.Name) }}
                      key: neo4j-password
                - name: WP6_SYNC_PAGE_SIZE
                  value: {{ .Values.sync.pageSize | quote }}
                - name: WP6_SYNC_WINDOW_DAYS
                  value: {{ .Values.sync.windowDays | quote }}
                - name: WP6_ENDPOINTS
                  value: {{ .Values.sync.endpoints | quote }}
                - name: WP6_SYNC_MODE
                  value: {{ .Values.sync.mode | quote }}
                - name: WP6_LOG_LEVEL
                  value: "INFO"
                - name: WP6_LOG_FORMAT
                  value: "json"
              resources:
                {{- toYaml .Values.sync.resources | nindent 16 }}
{{- end }}
