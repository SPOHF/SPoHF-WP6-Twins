{{- if .Values.red.enabled }}
{{- $redImage := .Values.red.image.repository | default (printf "%s-red" .Values.image.repository) }}
{{- $redTag := .Values.red.image.tag | default .Values.image.tag }}
{{- $redSecret := .Values.red.secrets.existingSecret | default (printf "%s-red-secrets" .Chart.Name) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-red-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-red-dashboard
spec:
  replicas: {{ .Values.red.replicas }}
  # Recreate, not RollingUpdate: this pod still mounts ReadWriteOnce PVCs
  # (manual-uploads, models). On a block-device StorageClass the volume attaches
  # to a single node, so RollingUpdate deadlocks — the new pod can't attach the
  # volume the old pod still holds (Multi-Attach error). Terminate the old pod
  # first, then start the new one. Fine for a single-replica dashboard.
  #
  # Exports no longer count: they moved to the object store (issue 061 phase 1),
  # which is also why the export CronJob is no longer pinned to this pod's node.
  # This becomes RollingUpdate — and the deploy stops being an outage — once
  # models and manual-uploads follow, in phases 2 and 3.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-red-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-red-dashboard
    spec:
      # appuser (uid/gid 1000) must be able to write the manual-uploads PVC; on a
      # block-device StorageClass the mount root is root:root, so fsGroup chowns
      # it to gid 1000. See blue-dashboard.yaml for the full rationale.
      securityContext:
        fsGroup: 1000
      containers:
        - name: dashboard
          image: "{{ $redImage }}:{{ $redTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: WP6_RED_DB_HOST
              value: {{ .Values.red.mysql.host | quote }}
            - name: WP6_RED_DB_PORT
              value: {{ .Values.red.mysql.port | quote }}
            - name: WP6_RED_DB_NAME
              value: {{ .Values.red.mysql.database | quote }}
            - name: WP6_RED_DB_USER
              value: {{ .Values.red.mysql.user | quote }}
            - name: WP6_RED_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $redSecret }}
                  key: mysql-password
            - name: WP6_RED_TSDB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $redSecret }}
                  key: tsdb-url
            - name: WP6_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Chart.Name) }}
                  key: oidc-client-secret
            - name: WP6_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Chart.Name) }}
                  key: oidc-session-secret
            - name: WP6_OIDC_REDIRECT_BASE
              value: {{ printf "https://%s" .Values.red.ingress.host | quote }}
            {{- include "wp6-data.objectStoreEnv" (dict "root" $) | nindent 12 }}
            # Models persist on their own volume, so a deploy reads them back
            # instead of refitting — see helm/templates/red-models.yaml.
            - name: WP6_RED_CLIMATE_MODEL_PATH
              value: /data/models/climate_model.pkl
            - name: WP6_RED_DLI_MODEL_PATH
              value: /data/models/light_model.pkl
            # Refit on a clock instead, so persisting them doesn't freeze them.
            - name: WP6_RED_RETRAIN_AT
              value: {{ .Values.red.retrainAt | quote }}
          volumeMounts:
            - name: manual-uploads
              mountPath: /data/manual-uploads
            - name: models
              mountPath: /data/models
          resources:
            {{- toYaml .Values.red.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 18
      volumes:
        - name: manual-uploads
          persistentVolumeClaim:
            claimName: {{ .Chart.Name }}-red-manual-uploads
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Chart.Name }}-red-models
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-red-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-red-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-red-dashboard
{{- if .Values.red.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-red-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-red-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.red.ingress.host }}
      secretName: {{ .Chart.Name }}-red-dashboard-tls
  rules:
    - host: {{ .Values.red.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}-red-dashboard
                port:
                  name: http
{{- end }}
{{- end }}
