{{- if .Values.dashboard.enabled }}
{{- if .Values.dashboard.export.enabled }}
{{- $blueSecret := .Values.dashboard.secrets.existingSecret | default (printf "%s-blue-secrets" .Chart.Name) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-blue-export
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-blue-export
spec:
  schedule: {{ .Values.dashboard.export.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}-blue-export
        spec:
          restartPolicy: OnFailure
          containers:
            - name: export
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "wp6_data.blue.export"]
              env:
                - name: WP6_TSDB_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ $blueSecret }}
                      key: tsdb-url
                {{- include "wp6-data.objectStoreEnv" (dict "root" $) | nindent 16 }}
              resources:
                {{- toYaml .Values.dashboard.export.resources | nindent 16 }}
{{- end }}
{{- end }}
