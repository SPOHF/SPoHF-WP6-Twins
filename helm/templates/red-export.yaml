{{- if .Values.red.enabled }}
{{- if .Values.red.export.enabled }}
{{- $redImage := .Values.red.image.repository | default (printf "%s-red" .Values.image.repository) }}
{{- $redTag := .Values.red.image.tag | default .Values.image.tag }}
{{- $redSecret := .Values.red.secrets.existingSecret | default (printf "%s-red-secrets" .Chart.Name) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-red-exports
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-red-exports
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.red.export.storageSize | default "1Gi" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-red-export
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-red-export
spec:
  schedule: {{ .Values.red.export.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}-red-export
        spec:
          restartPolicy: OnFailure
          containers:
            - name: export
              image: "{{ $redImage }}:{{ $redTag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "wp6_data.red.export"]
              env:
                - name: WP6_RED_DB_HOST
                  value: {{ .Values.red.mysql.host | quote }}
                - name: WP6_RED_DB_PORT
                  value: {{ .Values.red.mysql.port | quote }}
                - name: WP6_RED_DB_NAME
                  value: {{ .Values.red.mysql.database | quote }}
                - name: WP6_RED_DB_USER
                  value: {{ .Values.red.mysql.user | quote }}
                - name: WP6_RED_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $redSecret }}
                      key: mysql-password
                - name: WP6_RED_EXPORT_DIR
                  value: /data/exports
              volumeMounts:
                - name: exports
                  mountPath: /data/exports
              resources:
                {{- toYaml .Values.red.export.resources | nindent 16 }}
          volumes:
            - name: exports
              persistentVolumeClaim:
                claimName: {{ .Chart.Name }}-red-exports
{{- end }}
{{- end }}
