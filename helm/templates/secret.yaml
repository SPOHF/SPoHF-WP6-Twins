{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
type: Opaque
stringData:
  api-token: {{ .Values.secrets.apiToken | quote }}
  oidc-client-secret: {{ .Values.secrets.oidcClientSecret | quote }}
  oidc-session-secret: {{ .Values.secrets.oidcSessionSecret | quote }}
  tsdb-url: {{ .Values.secrets.tsdbUrl | quote }}
  tsdb-password: {{ .Values.secrets.tsdbPassword | quote }}
  yookr-email: {{ .Values.secrets.yookrEmail | quote }}
  yookr-password: {{ .Values.secrets.yookrPassword | quote }}
{{- end }}
