{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
type: Opaque
stringData:
  oidc-client-secret: {{ .Values.secrets.oidcClientSecret | quote }}
  oidc-session-secret: {{ .Values.secrets.oidcSessionSecret | quote }}
  tsdb-url: {{ .Values.secrets.tsdbUrl | quote }}
{{- end }}
