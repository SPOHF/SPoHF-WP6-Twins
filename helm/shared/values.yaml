# WP6 Shared Infrastructure - TimescaleDB and sync jobs
# Deployed as a separate ArgoCD app to avoid shared resource ownership conflicts

image:
  repository: ""  # Required: e.g., harbor.example.com/spohf/wp6-data-blue
  pullPolicy: Always
  tag: "latest"

# TimescaleDB (shared by blue and red twins)
timescaledb:
  enabled: true

# Combined sync CronJob (SPoHF API + Yookr API, sequential)
sync:
  enabled: true
  schedule: "*/15 * * * *"
  pageSize: 1000
  endpoints: "yookr-data"
  mode: "incremental"  # "full" or "incremental"
  windowDays: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

# SPoHF API
api:
  baseUrl: "https://backoffice.spohf.com"

# Secrets (referenced from ExternalSecret or direct)
secrets:
  existingSecret: ""  # Name of existing secret (default: wp6-data-secrets)
  # Blue-twin-specific secret holding tsdb-url for the wp6_blue database.
  # Separate from the shared secret so red can have a symmetric red-secrets.
  blueSecret: ""  # Name of blue secret (default: wp6-data-blue-secrets)
