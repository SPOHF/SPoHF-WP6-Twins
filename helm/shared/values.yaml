# WP6 Shared Infrastructure - TimescaleDB and sync jobs
# Deployed as a separate ArgoCD app to avoid shared resource ownership conflicts

image:
  repository: ""  # Required: e.g., harbor.example.com/spohf/wp6-data-blue
  pullPolicy: Always
  tag: "latest"

# TimescaleDB (shared by blue and red twins)
timescaledb:
  enabled: true
  # PGDATA location. Empty → image default (the mount root), which is correct for
  # local-path volumes and for any EXISTING instance whose data already sits at the
  # root (e.g. the legacy cluster — do not change it there). Set to a subdirectory
  # of the data mount for a block-device PVC (ext4/cloudstack-csi), whose lost+found
  # otherwise makes initdb refuse the "not empty" mount root. Opt in per-cluster via
  # the wp6-data-shared Application's helm parameters, not here.
  pgData: ""

# SPoHF datalake sync CronJob (the single automated source)
sync:
  enabled: true
  schedule: "*/15 * * * *"
  pageSize: 1000
  endpoints: "yookr-data"
  mode: "incremental"  # "full" or "incremental"
  windowDays: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

# LetsGrow sync CronJob → red's database (wp6_red). LetsGrow is delivered once
# a day (day D reaches the relay late on D+1), so hourly is plenty.
# Incremental mode re-reads the last days each run. A historical backfill is a
# one-off Job with mode "full" and WP6_SYNC_START=2023-02-11 — the relay's
# first LetsGrow day, earlier than the sync's default start — and a deadline
# of hours, not this CronJob's 15 minutes.
letsgrowSync:
  enabled: true
  schedule: "40 * * * *"
  pageSize: 1000
  mode: "incremental"  # "full" or "incremental"
  windowDays: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

# SPoHF API
api:
  baseUrl: "https://backoffice.spohf.com"

# Secrets (referenced from ExternalSecret or direct)
secrets:
  existingSecret: ""  # Name of existing secret (default: wp6-data-secrets)
  # Blue-twin-specific secret holding tsdb-url for the wp6_blue database.
  # Separate from the shared secret so red can have a symmetric red-secrets.
  blueSecret: ""  # Name of blue secret (default: wp6-data-blue-secrets)
  # Red-twin secret holding tsdb-url for the wp6_red database (LetsGrow sync).
  # The same secret the red dashboard reads.
  redSecret: ""  # Name of red secret (default: wp6-data-red-secrets)

# Alerting → the spohf Discord channel (Alertmanager in the monitoring stack).
# The AlertmanagerConfig lives in this namespace, so prometheus-operator scopes
# its route to namespace=<release namespace>: only this namespace's alerts reach
# the channel, including the stock kube-prometheus-stack ones (crash loops,
# failed jobs, PVCs filling up).
alerting:
  enabled: true
  # Created by hand (kubectl), never in git: anyone holding the URL can post.
  discord:
    secretName: spohf-alertmanager-discord
    secretKey: url
  route:
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
  # A single failed sync run is routine (upstream blips, retried 15 min later),
  # so the stock KubeJobFailed is dropped for these Jobs; Wp6SyncFailing and
  # the freshness states judge the sync instead. Matched against job_name.
  quietJobFailures: "wp6-data-sync-.*"
  rules:
    # A workload with zero ready replicas. Dashboards roll out surge-first, so a
    # deploy never reaches zero: this only fires on a real outage.
    unavailableFor: 5m
    # Same verdict as the /status page (`wp6_sync_state`), budgets per endpoint.
    syncStaleFor: 30m
    syncOutageFor: 15m
    # Failed runs in a row before alerting (scheduled feeds only).
    syncFailingRuns: 3
    # The dashboard can't read its own sync_metadata (DB unreachable).
    syncMetadataUnreadableFor: 10m
    # No wp6_sync_up scraped at all: every sync alert above is blind.
    metricsAbsentFor: 30m
