{{- if .Values.yookrSync.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wp6-data-yookr-sync
  labels:
    app.kubernetes.io/name: wp6-data-yookr-sync
spec:
  schedule: {{ .Values.yookrSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wp6-data-yookr-sync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: yookr-sync
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "wp6_data", "--yookr"]
              env:
                - name: WP6_TSDB_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret | default "wp6-data-secrets" }}
                      key: tsdb-url
                - name: WP6_YOOKR_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret | default "wp6-data-secrets" }}
                      key: yookr-email
                - name: WP6_YOOKR_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret | default "wp6-data-secrets" }}
                      key: yookr-password
                - name: WP6_SYNC_MODE
                  value: {{ .Values.yookrSync.mode | default "incremental" | quote }}
                - name: WP6_LOG_LEVEL
                  value: "INFO"
                - name: WP6_LOG_FORMAT
                  value: "json"
              resources:
                {{- toYaml .Values.yookrSync.resources | nindent 16 }}
{{- end }}
