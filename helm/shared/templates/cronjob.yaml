{{- if .Values.sync.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wp6-data-sync
  labels:
    app.kubernetes.io/name: wp6-data-sync
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wp6-data-sync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "wp6_data"]
              env:
                # SPoHF API
                - name: WP6_API_BASE_URL
                  value: {{ .Values.api.baseUrl | quote }}
                - name: WP6_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret | default "wp6-data-secrets" }}
                      key: api-token
                # Yookr API
                - name: WP6_YOOKR_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret | default "wp6-data-secrets" }}
                      key: yookr-email
                - name: WP6_YOOKR_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret | default "wp6-data-secrets" }}
                      key: yookr-password
                # Shared
                - name: WP6_TSDB_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret | default "wp6-data-secrets" }}
                      key: tsdb-url
                - name: WP6_SYNC_PAGE_SIZE
                  value: {{ .Values.sync.pageSize | quote }}
                - name: WP6_SYNC_WINDOW_DAYS
                  value: {{ .Values.sync.windowDays | quote }}
                - name: WP6_ENDPOINTS
                  value: {{ .Values.sync.endpoints | quote }}
                - name: WP6_SYNC_MODE
                  value: {{ .Values.sync.mode | quote }}
                - name: WP6_LOG_LEVEL
                  value: "INFO"
                - name: WP6_LOG_FORMAT
                  value: "json"
              resources:
                {{- toYaml .Values.sync.resources | nindent 16 }}
{{- end }}
