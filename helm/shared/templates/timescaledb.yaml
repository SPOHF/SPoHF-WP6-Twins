{{- if .Values.timescaledb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wp6-data-timescaledb
  labels:
    app.kubernetes.io/name: wp6-data-timescaledb
spec:
  serviceName: wp6-data-timescaledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wp6-data-timescaledb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wp6-data-timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:2.26.4-pg17
          # Postgres tuning via -c overrides. shared_buffers ≈ 25% of memory
          # limit; effective_cache_size ≈ 75% (planner hint, not allocation);
          # work_mem keeps time_bucket aggregations in RAM;
          # random_page_cost=1.1 matches SSD-backed PVCs.
          args:
            - -c
            - shared_buffers=2GB
            - -c
            - effective_cache_size=6GB
            - -c
            - work_mem=64MB
            - -c
            - maintenance_work_mem=512MB
            - -c
            - max_wal_size=2GB
            - -c
            - random_page_cost=1.1
            - -c
            - timescaledb.max_background_workers=8
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "wp6-data-secrets" }}
                  key: tsdb-password
            {{- with .Values.timescaledb.pgData }}
            # Initialise Postgres in a SUBDIRECTORY of the mount rather than the
            # mount root. A real block-device PVC (ext4, e.g. cloudstack-csi) has
            # a lost+found at its root, which makes initdb refuse a "not empty"
            # data directory; local-path volumes are bare host dirs and don't hit
            # this. MUST stay empty for any existing instance whose data already
            # lives at the mount root — changing PGDATA there points Postgres at
            # an empty subdir and it silently inits a fresh, blank database.
            - name: PGDATA
              value: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 1
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wp6-data-timescaledb
  labels:
    app.kubernetes.io/name: wp6-data-timescaledb
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: wp6-data-timescaledb
{{- end }}
