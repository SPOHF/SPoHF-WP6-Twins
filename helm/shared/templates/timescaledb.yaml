{{- if .Values.timescaledb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wp6-data-timescaledb
  labels:
    app.kubernetes.io/name: wp6-data-timescaledb
spec:
  serviceName: wp6-data-timescaledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wp6-data-timescaledb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wp6-data-timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:2.26.4-pg17
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default "wp6-data-secrets" }}
                  key: tsdb-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wp6-data-timescaledb
  labels:
    app.kubernetes.io/name: wp6-data-timescaledb
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: wp6-data-timescaledb
{{- end }}
