# WP6 Data Twin - Helm Values
# Dashboard deployments for blue and red twins
# Shared infrastructure (TimescaleDB, sync jobs) is in helm/shared/

image:
  repository: ""  # Required: e.g., ghcr.io/yourorg/wp6-data
  pullPolicy: Always
  tag: "latest"

# Per-twin database bootstrap (Helm hook Jobs, see templates/_tsdb-bootstrap.tpl).
# The TimescaleDB *instance* is owned by the shared chart (helm/shared); each twin
# owns the *database* it writes to — red: wp6_red, blue: wp6_blue. One instance, so
# host/port/image are configured once here rather than per twin.
tsdbBootstrap:
  defaultImage: "timescale/timescaledb:2.26.4-pg17"
  image: ""  # override defaultImage
  tsdbHost: "wp6-data-timescaledb"
  tsdbPort: "5432"

# Dashboard
dashboard:
  enabled: true
  # Intentionally 1 replica so failures (OOM, slow query) stay visible
  # rather than being masked by the second pod still serving requests.
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: 750m
      memory: 2Gi
  ingress:
    enabled: true
    host: ""  # Required: e.g., wp6.example.com
  # Blue-specific secrets (currently just the TSDB connection URL).
  # OIDC and other genuinely-shared secrets stay in the top-level `secrets`.
  secrets:
    existingSecret: ""  # default: <release>-blue-secrets
    # Keys expected in secret:
    # - tsdb-url: Postgres connection string for blue's database (wp6_blue)
  # Persistent volume for blue manual uploads (insect CSV + future sources).
  # Files: /data/blue-manual-uploads/{slug}/{sha256}{suffix}; only the latest
  # 2 per source kept on disk (audit rows in manual_uploads kept forever).
  manualUploads:
    size: "5Gi"
  # PVC for trained soil-forecast models. Kept across a deploy so the dashboard
  # reads them back instead of refitting on every cold boot. Pickles, not a
  # dataset — 1Gi is generous.
  models:
    size: "1Gi"
  # Time of day (UTC, HH:MM) to refit the soil-forecast models. Persisting them
  # means a cold boot no longer does it, so this is what keeps them current.
  # Empty disables the schedule. Offset from red's so the two twins don't fit
  # at the same moment on a shared cluster.
  retrainAt: "03:30"
  # CSV export job (runs nightly, generates downloadable CSVs per device)
  export:
    enabled: true
    schedule: "0 2 * * *"  # 2 AM daily
    storageSize: "1Gi"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

# Secrets (referenced from ExternalSecret or direct)
# Top-level `secrets` holds genuinely-shared values (OIDC). Twin-specific
# values (tsdb-url) live in `dashboard.secrets` (blue) and `red.secrets` (red).
secrets:
  create: false  # Set to true to create secret from values, false to use existing
  existingSecret: ""  # Name of existing secret (default: <release>-secrets)
  oidcClientSecret: ""   # OIDC client secret for wp6-data client
  oidcSessionSecret: ""  # Random string for signing session cookies (generate with: python -c "import secrets; print(secrets.token_hex(32))")

# Grey Dashboard (in-memory demo, no auth, no database)
grey:
  enabled: false
  replicas: 1
  image:
    repository: ""  # If empty, uses main image.repository with "-grey" suffix
    tag: ""  # If empty, uses main image.tag
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  ingress:
    enabled: true
    host: ""  # Required if enabled: e.g., wp6-grey.example.com

# Red Dashboard (MySQL backend with auth)
red:
  enabled: false
  # Intentionally 1 replica — same reasoning as the blue dashboard above.
  replicas: 1
  image:
    repository: ""  # If empty, uses main image.repository with "-red" suffix
    tag: ""  # If empty, uses main image.tag
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      # A ceiling, not a reservation: the pod is guaranteed `requests.cpu` and
      # may burst to this when the node has CPU spare, so raising it costs
      # nothing while idle. Raised from 750m because model training is
      # CPU-bound and single-threaded (BLAS does not parallelise matrices this
      # small — measured: pinning it to one thread changes nothing), and a
      # refit that takes ~1 minute on a workstation was taking ~17 in here.
      # The nightly refit is the only thing that wants this headroom; serving
      # requests does not come close to it.
      cpu: 2000m
      memory: 2Gi
  ingress:
    enabled: true
    host: ""  # Required if enabled: e.g., wp6-red.example.com
  mysql:
    host: ""
    port: 3306
    database: ""
    user: ""
    # password from secret
  # Secret for red-specific credentials (mysql password, tsdb url + role pw)
  secrets:
    existingSecret: ""  # Name of existing secret (default: <release>-red-secrets)
    # Keys expected in secret:
    # - mysql-password: MySQL password (live SPoHF feed)
    # - tsdb-url: Postgres connection string for red's database (wp6_red)
    # - tsdb-red-password: password for the wp6_red role (used by bootstrap Job
    #   to provision the role; must match the password embedded in tsdb-url)
  # PVC for manually-uploaded measurement files (Sijia, etc.)
  manualUploads:
    size: "5Gi"
  # PVC for trained models (DLI + climate chain). Kept across a deploy so the
  # dashboard reads them back instead of refitting on every cold boot. Pickles,
  # not a dataset — 1Gi is generous.
  models:
    size: "1Gi"
  # Time of day (UTC, HH:MM) to refit both red models. Persisting them means a
  # cold boot no longer does it, so this is what keeps them current — and for
  # the climate chain it is also when it re-decides its seasonal term and which
  # greenhouse reference wins. Empty disables the schedule.
  retrainAt: "03:00"
  # CSV export job (runs nightly, generates downloadable CSVs)
  export:
    enabled: true
    schedule: "0 2 * * *"  # 2 AM daily
    storageSize: "1Gi"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
