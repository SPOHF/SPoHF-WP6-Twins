# WP6 Data Twin - Helm Values
# Dashboard deployments for blue and red twins
# Shared infrastructure (TimescaleDB, sync jobs) is in helm/shared/

image:
  repository: ""  # Required: e.g., ghcr.io/yourorg/wp6-data
  pullPolicy: Always
  tag: "latest"

# Dashboard
dashboard:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 1Gi
  ingress:
    enabled: true
    host: ""  # Required: e.g., wp6.example.com
  # Blue-specific secrets (currently just the TSDB connection URL).
  # OIDC and other genuinely-shared secrets stay in the top-level `secrets`.
  secrets:
    existingSecret: ""  # default: <release>-blue-secrets
    # Keys expected in secret:
    # - tsdb-url: Postgres connection string for blue's database (wp6_blue)
  # CSV export job (runs nightly, generates downloadable CSVs per device)
  export:
    enabled: true
    schedule: "0 2 * * *"  # 2 AM daily
    storageSize: "1Gi"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

# Secrets (referenced from ExternalSecret or direct)
# Top-level `secrets` holds genuinely-shared values (OIDC). Twin-specific
# values (tsdb-url) live in `dashboard.secrets` (blue) and `red.secrets` (red).
secrets:
  create: false  # Set to true to create secret from values, false to use existing
  existingSecret: ""  # Name of existing secret (default: <release>-secrets)
  oidcClientSecret: ""   # OIDC client secret for wp6-data client
  oidcSessionSecret: ""  # Random string for signing session cookies (generate with: python -c "import secrets; print(secrets.token_hex(32))")

# Grey Dashboard (in-memory demo, no auth, no database)
grey:
  enabled: false
  replicas: 1
  image:
    repository: ""  # If empty, uses main image.repository with "-grey" suffix
    tag: ""  # If empty, uses main image.tag
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  ingress:
    enabled: true
    host: ""  # Required if enabled: e.g., wp6-grey.example.com

# Red Dashboard (MySQL backend with auth)
red:
  enabled: false
  replicas: 1
  image:
    repository: ""  # If empty, uses main image.repository with "-red" suffix
    tag: ""  # If empty, uses main image.tag
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 1Gi
  ingress:
    enabled: true
    host: ""  # Required if enabled: e.g., wp6-red.example.com
  mysql:
    host: ""
    port: 3306
    database: ""
    user: ""
    # password from secret
  # Secret for red-specific credentials (mysql password, tsdb url + role pw)
  secrets:
    existingSecret: ""  # Name of existing secret (default: <release>-red-secrets)
    # Keys expected in secret:
    # - mysql-password: MySQL password (live SPoHF feed)
    # - tsdb-url: Postgres connection string for red's database (wp6_red)
    # - tsdb-red-password: password for the wp6_red role (used by bootstrap Job
    #   to provision the role; must match the password embedded in tsdb-url)
  # PVC for manually-uploaded measurement files (Sijia, etc.)
  manualUploads:
    size: "5Gi"
  # Bootstrap Job (Helm hook) — creates wp6_red role + database in shared TSDB
  tsdbBootstrap:
    image: ""  # Defaults to timescale/timescaledb:latest-pg17
    tsdbHost: "wp6-data-timescaledb"
    tsdbPort: "5432"
  # CSV export job (runs nightly, generates downloadable CSVs)
  export:
    enabled: true
    schedule: "0 2 * * *"  # 2 AM daily
    storageSize: "1Gi"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
