# WP6 Data Sync - Helm Values
# Syncs sensor data from SPoHF/Yookr API to Neo4j

image:
  repository: ""  # Required: e.g., ghcr.io/yourorg/wp6-data
  pullPolicy: Always
  tag: "latest"

# Neo4j (deployed alongside)
neo4j:
  enabled: true
  auth:
    password: ""  # Set via secret

# Dashboard
dashboard:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    host: ""  # Required: e.g., wp6.example.com

# Sync CronJob
sync:
  enabled: true
  schedule: "*/15 * * * *"  # Every 15 minutes
  lookbackHours: 24
  pageSize: 1000
  maxPages: 1000
  endpoints: "yookr-data"
  mode: "auto"  # "auto", "windowed" (full historical), or "incremental"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# SPoHF API
api:
  baseUrl: "https://backoffice.spohf.com"
  # token set via secret

# Secrets (referenced from ExternalSecret or direct)
secrets:
  create: false  # Set to true to create secret from values, false to use existing
  existingSecret: ""  # Name of existing secret (default: <release>-secrets)
  apiToken: ""
  neo4jPassword: ""

# Red Dashboard (MySQL backend with auth)
red:
  enabled: false
  replicas: 1
  image:
    repository: ""  # If empty, uses main image.repository with "-red" suffix
    tag: ""  # If empty, uses main image.tag
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    host: ""  # Required if enabled: e.g., wp6-red.example.com
  mysql:
    host: ""
    port: 3306
    database: ""
    user: ""
    # password from secret
  oidc:
    issuer: "https://auth.fontysvenlo.dev/realms/spohf"
    clientId: "wp6-red-dashboard"
    adminGroup: "/wp6-admins"
  secrets:
    existingSecret: ""  # Name of existing secret (default: <release>-red-secrets)
    # Keys expected in secret:
    # - mysql-password: MySQL password
    # - oidc-client-secret: Keycloak OIDC client secret
    # - session-secret: Random secret for cookie sessions
  # CSV export job (runs nightly, generates downloadable CSVs)
  export:
    enabled: true
    schedule: "0 2 * * *"  # 2 AM daily
    storageSize: "1Gi"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
