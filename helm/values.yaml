# WP6 Data Sync - Helm Values
# Syncs sensor data from SPoHF/Yookr API to TimescaleDB

image:
  repository: ""  # Required: e.g., ghcr.io/yourorg/wp6-data
  pullPolicy: Always
  tag: "latest"

# TimescaleDB (deployed alongside)
timescaledb:
  enabled: true

# Dashboard
dashboard:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    host: ""  # Required: e.g., wp6.example.com

# SPoHF Sync CronJob (datalake API)
sync:
  enabled: true
  schedule: "*/15 * * * *"
  pageSize: 1000
  endpoints: "yookr-data"
  mode: "incremental"  # "full" or "incremental"
  windowDays: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Yookr Sync CronJob (direct API)
yookrSync:
  enabled: true
  schedule: "*/15 * * * *"
  mode: "incremental"  # "full" or "incremental"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# SPoHF API
api:
  baseUrl: "https://backoffice.spohf.com"
  # token set via secret

# Secrets (referenced from ExternalSecret or direct)
secrets:
  create: false  # Set to true to create secret from values, false to use existing
  existingSecret: ""  # Name of existing secret (default: <release>-secrets)
  apiToken: ""
  neo4jPassword: ""
  oidcClientSecret: ""   # OIDC client secret for wp6-data client
  oidcSessionSecret: ""  # Random string for signing session cookies (generate with: python -c "import secrets; print(secrets.token_hex(32))")
  tsdbUrl: ""        # e.g., postgresql://user:pass@host:5432/dbname
  tsdbPassword: ""
  yookrEmail: ""
  yookrPassword: ""

# Red Dashboard (MySQL backend with auth)
red:
  enabled: false
  replicas: 1
  image:
    repository: ""  # If empty, uses main image.repository with "-red" suffix
    tag: ""  # If empty, uses main image.tag
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    host: ""  # Required if enabled: e.g., wp6-red.example.com
  mysql:
    host: ""
    port: 3306
    database: ""
    user: ""
    # password from secret
  # Secret for red-specific credentials (mysql password)
  secrets:
    existingSecret: ""  # Name of existing secret (default: <release>-red-secrets)
    # Keys expected in secret:
    # - mysql-password: MySQL password
  # CSV export job (runs nightly, generates downloadable CSVs)
  export:
    enabled: true
    schedule: "0 2 * * *"  # 2 AM daily
    storageSize: "1Gi"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
