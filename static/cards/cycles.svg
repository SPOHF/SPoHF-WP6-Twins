<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" width="600" height="200">
  <defs>
    <linearGradient id="lanesFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="25%" stop-color="white" stop-opacity="0"/>
      <stop offset="55%" stop-color="white" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <mask id="lanesMask">
      <rect x="0" y="0" width="600" height="200" fill="url(#lanesFade)"/>
    </mask>
  </defs>

  <g mask="url(#lanesMask)">

    <!-- One lane per cohort, each starting later than the last: the cycle
         repeats while the season moves on, so a vertical slice cuts several
         cohorts at different stages -->
    <g fill="white">
      <rect x="286" y="26" width="140" height="15" rx="7.5" fill-opacity="0.10"/>
      <rect x="326" y="60" width="140" height="15" rx="7.5" fill-opacity="0.16"/>
      <rect x="366" y="94" width="140" height="15" rx="7.5" fill-opacity="0.24"/>
      <rect x="406" y="128" width="140" height="15" rx="7.5" fill-opacity="0.34"/>
      <rect x="446" y="162" width="146" height="15" rx="7.5" fill-opacity="0.48"/>
    </g>

    <!-- Phase divisions within each lane -->
    <g stroke="white" stroke-width="1.2" stroke-opacity="0.5">
      <g stroke-opacity="0.12">
        <line x1="333" y1="26" x2="333" y2="41"/><line x1="380" y1="26" x2="380" y2="41"/>
      </g>
      <g stroke-opacity="0.16">
        <line x1="373" y1="60" x2="373" y2="75"/><line x1="420" y1="60" x2="420" y2="75"/>
      </g>
      <g stroke-opacity="0.20">
        <line x1="413" y1="94" x2="413" y2="109"/><line x1="460" y1="94" x2="460" y2="109"/>
      </g>
      <g stroke-opacity="0.26">
        <line x1="453" y1="128" x2="453" y2="143"/><line x1="500" y1="128" x2="500" y2="143"/>
      </g>
      <g stroke-opacity="0.34">
        <line x1="493" y1="162" x2="493" y2="177"/><line x1="540" y1="162" x2="540" y2="177"/>
      </g>
    </g>

    <!-- Harvest end of each cohort -->
    <g fill="white">
      <circle cx="426" cy="33.5" r="2.4" fill-opacity="0.22"/>
      <circle cx="466" cy="67.5" r="2.8" fill-opacity="0.32"/>
      <circle cx="506" cy="101.5" r="3.2" fill-opacity="0.44"/>
      <circle cx="546" cy="135.5" r="3.6" fill-opacity="0.58"/>
    </g>

    <!-- A single date, cutting every cohort in flight -->
    <line x1="470" y1="12" x2="470" y2="190" stroke="white"
          stroke-width="1" stroke-opacity="0.13" stroke-dasharray="3 5"/>

  </g>
</svg>
