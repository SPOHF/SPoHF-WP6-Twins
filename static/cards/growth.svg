<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" width="600" height="200">
  <defs>
    <linearGradient id="growthFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="25%" stop-color="white" stop-opacity="0"/>
      <stop offset="55%" stop-color="white" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <mask id="growthMask">
      <rect x="0" y="0" width="600" height="200" fill="url(#growthFade)"/>
    </mask>
  </defs>

  <g mask="url(#growthMask)" fill="none">

    <!-- Harvest threshold lines (faint, dashed) -->
    <g stroke="white" stroke-width="1" stroke-dasharray="2 6">
      <line x1="290" y1="62" x2="582" y2="62" stroke-opacity="0.11"/>
      <line x1="290" y1="102" x2="582" y2="102" stroke-opacity="0.10"/>
      <line x1="290" y1="142" x2="582" y2="142" stroke-opacity="0.09"/>
    </g>

    <!-- Soft wash beneath the primary accumulation curve -->
    <path d="M290 180 C 372 178 424 156 462 120 C 494 90 524 74 566 62
             L566 184 L290 184 Z" fill="white" fill-opacity="0.05"/>

    <!-- Year-over-year cumulative GDD curves, graduated faint to crisp -->
    <path d="M290 185 C 408 184 470 182 508 160 C 538 142 562 132 582 124"
          stroke="white" stroke-width="1.4" stroke-opacity="0.1"/>
    <path d="M290 183 C 396 182 456 176 494 148 C 526 124 554 112 582 104"
          stroke="white" stroke-width="1.6" stroke-opacity="0.17"/>
    <path d="M290 181 C 384 180 440 168 480 134 C 512 108 544 92 582 82"
          stroke="white" stroke-width="2" stroke-opacity="0.28"/>
    <path d="M290 180 C 372 178 424 156 462 120 C 494 90 524 74 566 62"
          stroke="white" stroke-width="2.75" stroke-opacity="0.55"
          stroke-linecap="round"/>

    <!-- Accumulation nodes along the primary curve -->
    <g fill="white">
      <circle cx="372" cy="178" r="2" fill-opacity="0.3"/>
      <circle cx="424" cy="156" r="2.6" fill-opacity="0.35"/>
      <circle cx="462" cy="120" r="3.2" fill-opacity="0.42"/>
    </g>

    <!-- Harvest payoff: leaf + blueberry in the open lower-right pocket,
         clear of the primary curve crest and accumulation dots -->
    <!-- Leaf -->
    <path d="M498 176 C 508 156 522 144 540 138 C 532 156 520 168 498 176 Z"
          fill="white" fill-opacity="0.13"
          stroke="white" stroke-opacity="0.5" stroke-width="1.4"/>
    <path d="M501 173 L537 140" stroke="white" stroke-opacity="0.45"
          stroke-width="1"/>

    <!-- Blueberry -->
    <circle cx="552" cy="154" r="9" fill="white" fill-opacity="0.5"/>
    <circle cx="552" cy="154" r="9" stroke="white" stroke-opacity="0.62"
            stroke-width="1.6"/>
    <circle cx="548.5" cy="150.5" r="2.4" fill="white" fill-opacity="0.9"/>
    <!-- 5-point calyx crown at the blossom end (top) -->
    <g stroke="white" stroke-opacity="0.7" stroke-width="1.1"
       stroke-linecap="round">
      <path d="M553 146 L553 141"/>
      <path d="M553 146 L557.8 143.5"/>
      <path d="M553 146 L556 150.5"/>
      <path d="M553 146 L550 150.5"/>
      <path d="M553 146 L548.2 143.5"/>
    </g>
    <circle cx="553" cy="146" r="1.3" fill="white" fill-opacity="0.85"/>

  </g>
</svg>
